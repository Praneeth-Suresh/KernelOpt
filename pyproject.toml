[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelopt"
version = "0.1.0"
description = "Explanation-first optimized GPU kernels with reproducible evidence"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]
gpu = ["triton>=2.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["kernelopt*"]
